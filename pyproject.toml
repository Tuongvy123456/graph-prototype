[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-paper-graphrag"
version = "0.1.0"
description = "Evidence-linked scientific claim graph prototype"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "pydantic-settings>=2,<3", "httpx>=0.27,<1", "neo4j>=5,<7", "PyMuPDF>=1.24,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
nlp = ["gliner>=0.2,<1", "spacy>=3.8,<4", "protobuf>=4,<7"]
test = ["pytest>=8,<10"]

[project.scripts]
crossgraph = "crossgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
